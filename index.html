<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zyntherax</title>
    <meta name="description" content="zyntherax - Personal Profile">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #7832ff;
            --secondary: #ff006e;
            --accent: #3a86ff;
            --neon-green: #06ffa5;
            --bg-dark: #050510;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background: var(--bg-dark);
            color: var(--text-primary);
        }

        /* ═══════════════════════════════════════════
           BACKGROUND LAYERS
           ═══════════════════════════════════════════ */

        .fallback-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -3;
            background:
                radial-gradient(ellipse at 20% 80%, rgba(120, 50, 255, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 0, 110, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(58, 134, 255, 0.1) 0%, transparent 60%),
                var(--bg-dark);
            overflow: hidden;
        }

        /* Aurora Borealis Effect */
        .aurora {
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            opacity: 0.5;
            filter: blur(80px);
            animation: auroraShift 20s ease-in-out infinite;
        }

        .aurora::before,
        .aurora::after {
            content: '';
            position: absolute;
            border-radius: 50%;
        }

        .aurora::before {
            width: 60%; height: 60%;
            top: 10%; left: 10%;
            background: radial-gradient(ellipse, rgba(120, 50, 255, 0.4) 0%, rgba(58, 134, 255, 0.2) 40%, transparent 70%);
            animation: auroraPulse1 8s ease-in-out infinite;
        }

        .aurora::after {
            width: 50%; height: 50%;
            bottom: 10%; right: 10%;
            background: radial-gradient(ellipse, rgba(255, 0, 110, 0.3) 0%, rgba(120, 50, 255, 0.15) 40%, transparent 70%);
            animation: auroraPulse2 10s ease-in-out infinite;
        }

        @keyframes auroraShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            25% { transform: translate(-3%, 5%) rotate(3deg) scale(1.05); }
            50% { transform: translate(5%, -3%) rotate(-2deg) scale(0.95); }
            75% { transform: translate(-2%, -4%) rotate(1deg) scale(1.02); }
        }

        @keyframes auroraPulse1 {
            0%, 100% { opacity: 0.6; transform: scale(1) translate(0, 0); }
            33% { opacity: 0.9; transform: scale(1.15) translate(5%, -3%); }
            66% { opacity: 0.5; transform: scale(0.9) translate(-3%, 5%); }
        }

        @keyframes auroraPulse2 {
            0%, 100% { opacity: 0.5; transform: scale(1) translate(0, 0); }
            50% { opacity: 0.8; transform: scale(1.2) translate(-5%, 3%); }
        }

        .gradient-mesh {
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background:
                radial-gradient(circle at 30% 70%, rgba(120, 50, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 70% 30%, rgba(255, 0, 110, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(58, 134, 255, 0.08) 0%, transparent 50%);
            transition: transform 0.3s ease-out;
        }

        .mouse-glow {
            position: absolute;
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle,
                rgba(120, 50, 255, 0.15) 0%,
                rgba(58, 134, 255, 0.08) 30%,
                transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: floatShape 16s ease-in-out infinite;
        }

        .shape-1 { width: 450px; height: 450px; background: rgba(120, 50, 255, 0.3); top: 5%; left: 5%; animation-delay: 0s; animation-duration: 18s; }
        .shape-2 { width: 350px; height: 350px; background: rgba(255, 0, 110, 0.2); top: 55%; right: 8%; animation-delay: -5s; animation-duration: 14s; }
        .shape-3 { width: 400px; height: 400px; background: rgba(58, 134, 255, 0.2); bottom: 0%; left: 30%; animation-delay: -10s; animation-duration: 20s; }
        .shape-4 { width: 250px; height: 250px; background: rgba(6, 255, 165, 0.1); top: 30%; right: 25%; animation-delay: -7s; animation-duration: 22s; }

        @keyframes floatShape {
            0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
            20% { transform: translate(50px, -40px) scale(1.1) rotate(5deg); }
            40% { transform: translate(-30px, 30px) scale(0.9) rotate(-3deg); }
            60% { transform: translate(20px, 50px) scale(1.05) rotate(2deg); }
            80% { transform: translate(-40px, -20px) scale(0.95) rotate(-4deg); }
        }

        /* Perspective Grid */
        .grid-lines {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(120, 50, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(120, 50, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 10s linear infinite;
            mask-image: radial-gradient(ellipse at 50% 100%, black 20%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at 50% 100%, black 20%, transparent 70%);
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(60px); }
        }

        /* Noise Texture Overlay */
        .noise-overlay {
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            z-index: 10;
            pointer-events: none;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            animation: noiseShift 0.5s steps(3) infinite;
        }

        @keyframes noiseShift {
            0% { transform: translate(0, 0); }
            33% { transform: translate(-5%, -5%); }
            66% { transform: translate(5%, 5%); }
            100% { transform: translate(0, 0); }
        }

        /* Stars */
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: scale(0.6); }
            50% { opacity: 0.9; transform: scale(1.4); }
        }

        /* Video Background */
        .video-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0;
            transition: opacity 1s ease;
            background: #000;
        }

        .video-bg.ready { opacity: 1; }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.4) 0%,
                rgba(5, 5, 16, 0.3) 50%,
                rgba(0, 0, 0, 0.5) 100%
            );
            z-index: -1;
        }

        /* ═══════════════════════════════════════════
           PARTICLES
           ═══════════════════════════════════════════ */

        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) translateX(80px) rotate(360deg); opacity: 0; }
        }

        /* ═══════════════════════════════════════════
           CUSTOM CURSOR
           ═══════════════════════════════════════════ */

        .cursor {
            position: fixed;
            width: 22px; height: 22px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s ease-out, width 0.25s cubic-bezier(0.23, 1, 0.32, 1), height 0.25s cubic-bezier(0.23, 1, 0.32, 1), border-color 0.25s ease, background 0.25s ease;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
        }

        .cursor-dot {
            position: fixed;
            width: 5px; height: 5px;
            background: var(--text-primary);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.05s ease-out;
        }

        .cursor.hover {
            width: 50px; height: 50px;
            border-color: var(--primary);
            background: rgba(120, 50, 255, 0.08);
        }

        .trail {
            position: fixed;
            width: 6px; height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            animation: trailFade 0.6s ease-out forwards;
        }

        @keyframes trailFade {
            0% { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.1); }
        }

        /* ═══════════════════════════════════════════
           MAIN CONTAINER
           ═══════════════════════════════════════════ */

        .container {
            position: relative;
            z-index: 5;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: containerReveal 1.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes containerReveal {
            0% { opacity: 0; transform: translateY(30px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ═══════════════════════════════════════════
           PROFILE PICTURE WITH ORBITING RINGS
           ═══════════════════════════════════════════ */

        .profile-wrapper {
            position: relative;
            width: 180px; height: 180px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orbit-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid transparent;
            animation: orbitSpin linear infinite;
        }

        .orbit-ring-1 {
            width: 200px; height: 200px;
            border-top-color: rgba(120, 50, 255, 0.5);
            border-right-color: rgba(120, 50, 255, 0.2);
            animation-duration: 6s;
        }

        .orbit-ring-2 {
            width: 220px; height: 220px;
            border-bottom-color: rgba(255, 0, 110, 0.4);
            border-left-color: rgba(255, 0, 110, 0.15);
            animation-duration: 8s;
            animation-direction: reverse;
        }

        .orbit-ring-3 {
            width: 240px; height: 240px;
            border-top-color: rgba(58, 134, 255, 0.3);
            border-left-color: rgba(58, 134, 255, 0.1);
            animation-duration: 12s;
        }

        @keyframes orbitSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Orbit dots */
        .orbit-dot {
            position: absolute;
            width: 5px; height: 5px;
            border-radius: 50%;
            animation: orbitDot linear infinite;
        }

        .orbit-dot-1 {
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary);
            animation-duration: 6s;
        }

        .orbit-dot-2 {
            background: var(--secondary);
            box-shadow: 0 0 10px var(--secondary), 0 0 20px var(--secondary);
            animation-duration: 8s;
            animation-direction: reverse;
            width: 4px; height: 4px;
        }

        .orbit-dot-3 {
            background: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-green);
            animation-duration: 12s;
            width: 3px; height: 3px;
        }

        @keyframes orbitDot {
            0% { transform: rotate(0deg) translateX(100px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(100px) rotate(-360deg); }
        }

        .orbit-dot-2 {
            animation-name: orbitDot2;
        }

        @keyframes orbitDot2 {
            0% { transform: rotate(0deg) translateX(110px) rotate(0deg); }
            100% { transform: rotate(-360deg) translateX(110px) rotate(360deg); }
        }

        .orbit-dot-3 {
            animation-name: orbitDot3;
        }

        @keyframes orbitDot3 {
            0% { transform: rotate(0deg) translateX(120px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(120px) rotate(-360deg); }
        }

        .profile-gif {
            width: 150px; height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid transparent;
            background: linear-gradient(var(--bg-dark), var(--bg-dark)) padding-box,
                        linear-gradient(135deg, var(--secondary), var(--primary), var(--accent), var(--neon-green), var(--secondary)) border-box;
            background-size: 100% 100%, 300% 300%;
            animation: borderRotate 4s linear infinite, profileFloat 6s ease-in-out infinite;
            box-shadow:
                0 0 30px rgba(120, 50, 255, 0.25),
                0 0 60px rgba(120, 50, 255, 0.1),
                inset 0 0 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.4s ease;
            transform: translateZ(0);
            backface-visibility: hidden;
            position: relative;
            z-index: 2;
        }

        .profile-gif:hover {
            transform: scale(1.1) translateZ(0);
            box-shadow:
                0 0 40px rgba(120, 50, 255, 0.4),
                0 0 80px rgba(120, 50, 255, 0.2),
                0 0 120px rgba(120, 50, 255, 0.1);
        }

        @keyframes borderRotate {
            0% { background-position: 0% 50%, 0% 50%; }
            50% { background-position: 0% 50%, 100% 50%; }
            100% { background-position: 0% 50%, 0% 50%; }
        }

        @keyframes profileFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* ═══════════════════════════════════════════
           GLITCH TITLE
           ═══════════════════════════════════════════ */

        .title-wrapper {
            position: relative;
            margin-bottom: 10px;
            overflow: visible;
        }

        .title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 52px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 8px;
            text-transform: uppercase;
            text-shadow:
                /* 3D depth layers */
                1px 1px 0 rgba(120, 50, 255, 0.9),
                2px 2px 0 rgba(110, 45, 230, 0.8),
                3px 3px 0 rgba(100, 40, 210, 0.7),
                4px 4px 0 rgba(90, 35, 190, 0.6),
                5px 5px 0 rgba(80, 30, 170, 0.5),
                6px 6px 0 rgba(70, 25, 150, 0.4),
                7px 7px 0 rgba(60, 20, 130, 0.3),
                8px 8px 0 rgba(50, 15, 110, 0.2),
                /* Neon glow */
                0 0 10px rgba(120, 50, 255, 0.5),
                0 0 30px rgba(120, 50, 255, 0.3),
                0 0 60px rgba(120, 50, 255, 0.15),
                /* Bottom shadow */
                8px 12px 20px rgba(0, 0, 0, 0.5);
            animation: glowPulse3D 3s ease-in-out infinite;
            position: relative;
            display: inline-block;
            min-height: 1.2em;
            transform: perspective(500px) rotateX(5deg);
            transition: transform 0.3s ease;
        }

        .title:hover {
            transform: perspective(500px) rotateX(0deg) scale(1.05);
        }

        /* Blinking cursor after text */
        .title::after {
            content: '|';
            color: var(--primary);
            animation: blinkCaret 0.8s step-end infinite;
            margin-left: 2px;
            font-weight: 300;
        }

        @keyframes blinkCaret {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Glitch layers */
        .title-glitch {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            letter-spacing: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 48px;
            font-weight: 700;
            text-transform: uppercase;
            pointer-events: none;
        }

        .title-glitch-1 {
            color: var(--secondary);
            z-index: -1;
            animation: glitch1 3s infinite linear alternate-reverse;
            clip-path: inset(0 0 0 0);
        }

        .title-glitch-2 {
            color: var(--accent);
            z-index: -2;
            animation: glitch2 2.5s infinite linear alternate-reverse;
            clip-path: inset(0 0 0 0);
        }

        @keyframes glitch1 {
            0%, 85% { clip-path: inset(0 0 0 0); transform: translate(0); }
            86% { clip-path: inset(20% 0 60% 0); transform: translate(-3px, 1px); }
            87% { clip-path: inset(60% 0 10% 0); transform: translate(3px, -1px); }
            88% { clip-path: inset(40% 0 30% 0); transform: translate(-2px, 0); }
            89% { clip-path: inset(0 0 0 0); transform: translate(0); }
            90%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
        }

        @keyframes glitch2 {
            0%, 87% { clip-path: inset(0 0 0 0); transform: translate(0); }
            88% { clip-path: inset(30% 0 40% 0); transform: translate(3px, -2px); }
            89% { clip-path: inset(70% 0 5% 0); transform: translate(-3px, 2px); }
            90% { clip-path: inset(10% 0 70% 0); transform: translate(2px, 1px); }
            91% { clip-path: inset(0 0 0 0); transform: translate(0); }
            92%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
        }

        @keyframes glowPulse3D {
            0%, 100% {
                text-shadow:
                    1px 1px 0 rgba(120, 50, 255, 0.9),
                    2px 2px 0 rgba(110, 45, 230, 0.8),
                    3px 3px 0 rgba(100, 40, 210, 0.7),
                    4px 4px 0 rgba(90, 35, 190, 0.6),
                    5px 5px 0 rgba(80, 30, 170, 0.5),
                    6px 6px 0 rgba(70, 25, 150, 0.4),
                    7px 7px 0 rgba(60, 20, 130, 0.3),
                    8px 8px 0 rgba(50, 15, 110, 0.2),
                    0 0 10px rgba(120, 50, 255, 0.5),
                    0 0 30px rgba(120, 50, 255, 0.3),
                    0 0 60px rgba(120, 50, 255, 0.15),
                    8px 12px 20px rgba(0, 0, 0, 0.5);
            }
            50% {
                text-shadow:
                    1px 1px 0 rgba(120, 50, 255, 0.9),
                    2px 2px 0 rgba(110, 45, 230, 0.8),
                    3px 3px 0 rgba(100, 40, 210, 0.7),
                    4px 4px 0 rgba(90, 35, 190, 0.6),
                    5px 5px 0 rgba(80, 30, 170, 0.5),
                    6px 6px 0 rgba(70, 25, 150, 0.4),
                    7px 7px 0 rgba(60, 20, 130, 0.3),
                    8px 8px 0 rgba(50, 15, 110, 0.2),
                    0 0 20px rgba(120, 50, 255, 0.7),
                    0 0 50px rgba(120, 50, 255, 0.5),
                    0 0 90px rgba(120, 50, 255, 0.3),
                    0 0 130px rgba(120, 50, 255, 0.15),
                    8px 12px 25px rgba(0, 0, 0, 0.6);
            }
        }

        /* Subtitle */
        .subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 30px;
            overflow: hidden;
            animation: subtitleReveal 2s 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes subtitleReveal {
            0% { opacity: 0; transform: translateY(10px); letter-spacing: 12px; }
            100% { opacity: 1; transform: translateY(0); letter-spacing: 4px; }
        }

        /* Typing cursor indicator */
        .subtitle .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 14px;
            background: var(--primary);
            margin-left: 4px;
            vertical-align: middle;
            animation: blinkCursor 1s step-end infinite;
        }

        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ═══════════════════════════════════════════
           DIVIDER LINE
           ═══════════════════════════════════════════ */

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--secondary), transparent);
            margin-bottom: 28px;
            border-radius: 2px;
            animation: dividerGlow 2s ease-in-out infinite, dividerReveal 1.5s 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            opacity: 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: -1px; left: 0;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, rgba(120, 50, 255, 0.5), rgba(255, 0, 110, 0.5), transparent);
            filter: blur(4px);
        }

        @keyframes dividerGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(120, 50, 255, 0.3); }
            50% { box-shadow: 0 0 20px rgba(120, 50, 255, 0.6); }
        }

        @keyframes dividerReveal {
            0% { opacity: 0; width: 0; }
            100% { opacity: 1; width: 60px; }
        }

        /* ═══════════════════════════════════════════
           SOCIAL BUTTONS
           ═══════════════════════════════════════════ */

        .social-links {
            display: flex;
            gap: 16px;
            animation: socialReveal 1.5s 1.2s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        @keyframes socialReveal {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 54px; height: 54px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: var(--text-primary);
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s ease;
        }

        .social-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(120, 50, 255, 0), rgba(255, 0, 110, 0));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            transition: background 0.4s ease;
        }

        .social-btn:hover::before { left: 100%; }
        .social-btn:hover::after {
            background: linear-gradient(135deg, rgba(120, 50, 255, 0.5), rgba(255, 0, 110, 0.5));
        }

        .social-btn:hover {
            background: rgba(120, 50, 255, 0.1);
            border-color: rgba(120, 50, 255, 0.3);
            transform: translateY(-5px) scale(1.05);
            box-shadow:
                0 10px 40px rgba(120, 50, 255, 0.25),
                0 0 20px rgba(120, 50, 255, 0.15);
        }

        .social-btn:active {
            transform: translateY(-2px) scale(0.98);
        }

        .social-icon {
            width: 26px; height: 26px;
            object-fit: contain;
            filter: brightness(1.1);
            transition: filter 0.3s ease;
        }

        .social-btn:hover .social-icon {
            filter: brightness(1.3) drop-shadow(0 0 6px rgba(120, 50, 255, 0.5));
        }

        /* Tooltip */
        .social-btn .tooltip {
            position: absolute;
            bottom: -36px;
            left: 50%;
            transform: translateX(-50%) translateY(5px);
            background: rgba(0, 0, 0, 0.85);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            padding: 5px 12px;
            border-radius: 8px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .social-btn:hover .tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ═══════════════════════════════════════════
           STATUS BADGE
           ═══════════════════════════════════════════ */

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            margin-top: 32px;
            animation: badgeReveal 1.5s 1.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            opacity: 0;
        }

        @keyframes badgeReveal {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green);
            animation: statusPulse 2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--neon-green); }
            50% { opacity: 0.6; box-shadow: 0 0 16px var(--neon-green); }
        }

        /* ═══════════════════════════════════════════
           SCAN LINE EFFECT
           ═══════════════════════════════════════════ */

        .scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 11;
            opacity: 0.03;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255, 255, 255, 0.05) 2px,
                rgba(255, 255, 255, 0.05) 4px
            );
        }

        /* ═══════════════════════════════════════════
           VIGNETTE
           ═══════════════════════════════════════════ */

        .vignette {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.5) 100%);
        }

        /* ═══════════════════════════════════════════
           RESPONSIVE
           ═══════════════════════════════════════════ */

        @media (max-width: 600px) {
            .title { font-size: 32px; letter-spacing: 4px; }
            .title::before, .title::after { letter-spacing: 4px; }
            .profile-wrapper { width: 140px; height: 140px; }
            .profile-gif { width: 120px; height: 120px; }
            .orbit-ring-1 { width: 160px; height: 160px; }
            .orbit-ring-2 { width: 175px; height: 175px; }
            .orbit-ring-3 { width: 190px; height: 190px; }
            .social-btn { width: 48px; height: 48px; border-radius: 14px; }
            .social-icon { width: 22px; height: 22px; }
            .subtitle { font-size: 11px; letter-spacing: 3px; }
        }

        @media (max-width: 380px) {
            .title { font-size: 26px; letter-spacing: 3px; }
            .title::before, .title::after { letter-spacing: 3px; }
        }

        /* ═══════════════════════════════════════════
           LOADING SCREEN
           ═══════════════════════════════════════════ */

        .loader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg-dark);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-ring {
            width: 50px; height: 50px;
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: loaderSpin 0.8s linear infinite;
        }

        @keyframes loaderSpin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 20px;
            animation: loaderPulse 1.5s ease-in-out infinite;
        }

        @keyframes loaderPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loader" id="loader">
        <div class="loader-ring"></div>
        <div class="loader-text">loading</div>
    </div>

    <!-- Background -->
    <div class="fallback-bg" id="fallbackBg">
        <div class="aurora"></div>
        <div class="gradient-mesh" id="gradientMesh"></div>
        <div class="mouse-glow" id="mouseGlow"></div>
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
        <div class="floating-shape shape-4"></div>
        <div class="grid-lines"></div>
        <div id="starsContainer"></div>
    </div>

    <!-- Video Background -->
    <video class="video-bg" id="videoBg" autoplay muted loop playsinline preload="auto">
        <source src="https://res.cloudinary.com/dcqeykdxu/video/upload/Black_Dragon_4K_Live_Wallpaper_dr88px.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <!-- Effects Overlays -->
    <div class="noise-overlay"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <!-- Custom Cursor -->
    <div class="cursor" id="cursor"></div>
    <div class="cursor-dot" id="cursorDot"></div>

    <!-- Main Content -->
    <div class="container" id="container">



        <!-- Title with 3D Typewriter Effect -->
        <div class="title-wrapper">
            <h1 class="title" id="title"></h1>
        </div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Social Links -->
        <div class="social-links">
            <a href="https://www.roblox.com/tr/users/1582566009/profile"
               class="social-btn"
               target="_blank"
               rel="noopener noreferrer"
               id="robloxBtn"
               title="Roblox Profilim">
                <img src="https://media.tenor.com/HO1YAH0_iMcAAAAj/roblox-logo.gif"
                     alt="Roblox"
                     class="social-icon">
                <span class="tooltip">Roblox</span>
            </a>
        </div>

        <!-- Status Badge -->
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>Online</span>
        </div>
    </div>

    <canvas id="connectionCanvas"></canvas>

    <script>
        // ═══════════════════════════════════════════
        // LOADING SCREEN
        // ═══════════════════════════════════════════
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
            }, 1500);
        });

        // ═══════════════════════════════════════════
        // STARS
        // ═══════════════════════════════════════════
        function createStars() {
            const container = document.getElementById('starsContainer');
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 4 + 's';
                star.style.animationDuration = (Math.random() * 4 + 2) + 's';
                const size = Math.random() * 2.5 + 0.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                fragment.appendChild(star);
            }
            container.appendChild(fragment);
        }
        createStars();

        // ═══════════════════════════════════════════
        // VIDEO BACKGROUND
        // ═══════════════════════════════════════════
        const video = document.getElementById('videoBg');
        const fallbackBg = document.getElementById('fallbackBg');

        video.addEventListener('loadeddata', function() {
            video.classList.add('ready');
            fallbackBg.style.opacity = '0';
            fallbackBg.style.transition = 'opacity 1s ease';
        });

        video.addEventListener('error', function() {
            video.style.display = 'none';
        });

        // ═══════════════════════════════════════════
        // MOUSE INTERACTION
        // ═══════════════════════════════════════════
        const mouseGlow = document.getElementById('mouseGlow');
        const gradientMesh = document.getElementById('gradientMesh');
        let mouseX = 0, mouseY = 0;
        let targetMouseX = 0, targetMouseY = 0;

        document.addEventListener('mousemove', (e) => {
            targetMouseX = e.clientX;
            targetMouseY = e.clientY;

            mouseGlow.style.left = targetMouseX + 'px';
            mouseGlow.style.top = targetMouseY + 'px';
            mouseGlow.style.opacity = '1';

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const meshX = (targetMouseX - centerX) / centerX * 15;
            const meshY = (targetMouseY - centerY) / centerY * 15;
            gradientMesh.style.transform = `translate(${meshX}px, ${meshY}px)`;

            // Parallax container
            const container = document.getElementById('container');
            const parallaxX = (targetMouseX - centerX) / centerX * 5;
            const parallaxY = (targetMouseY - centerY) / centerY * 5;
            container.style.transform = `translate(${parallaxX}px, ${parallaxY}px)`;
        });

        document.addEventListener('mouseleave', () => {
            mouseGlow.style.opacity = '0';
            gradientMesh.style.transform = 'translate(0, 0)';
            document.getElementById('container').style.transform = 'translate(0, 0)';
        });

        // ═══════════════════════════════════════════
        // PARTICLES
        // ═══════════════════════════════════════════
        function createParticles() {
            const container = document.getElementById('particles');
            const fragment = document.createDocumentFragment();
            const colors = [
                'rgba(120, 50, 255, 0.6)',
                'rgba(255, 0, 110, 0.5)',
                'rgba(58, 134, 255, 0.5)',
                'rgba(6, 255, 165, 0.4)',
                'rgba(255, 255, 255, 0.4)'
            ];

            for (let i = 0; i < 60; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 12 + 8) + 's';
                particle.style.animationDelay = Math.random() * 12 + 's';
                const size = Math.random() * 3 + 1;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.boxShadow = `0 0 ${size * 3}px ${particle.style.background}`;
                fragment.appendChild(particle);
            }
            container.appendChild(fragment);
        }
        createParticles();

        // ═══════════════════════════════════════════
        // CUSTOM CURSOR
        // ═══════════════════════════════════════════
        const cursor = document.getElementById('cursor');
        const cursorDot = document.getElementById('cursorDot');
        let cursorX = 0, cursorY = 0;
        let trailCounter = 0;

        const trailColors = [
            'rgba(120, 50, 255, 0.5)',
            'rgba(255, 0, 110, 0.4)',
            'rgba(58, 134, 255, 0.4)',
            'rgba(6, 255, 165, 0.3)'
        ];

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursorDot.style.left = mouseX + 'px';
            cursorDot.style.top = mouseY + 'px';

            trailCounter++;
            if (trailCounter % 2 === 0) {
                const trail = document.createElement('div');
                trail.className = 'trail';
                trail.style.left = mouseX + 'px';
                trail.style.top = mouseY + 'px';
                trail.style.background = trailColors[Math.floor(Math.random() * trailColors.length)];
                const trailSize = Math.random() * 4 + 4;
                trail.style.width = trailSize + 'px';
                trail.style.height = trailSize + 'px';
                document.body.appendChild(trail);
                setTimeout(() => trail.remove(), 600);
            }
        });

        function animateCursor() {
            cursorX += (mouseX - cursorX) * 0.12;
            cursorY += (mouseY - cursorY) * 0.12;
            cursor.style.left = cursorX + 'px';
            cursor.style.top = cursorY + 'px';
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        document.querySelectorAll('a, .profile-gif, .social-btn').forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
        });

        // ═══════════════════════════════════════════
        // MAGNETIC BUTTON EFFECT
        // ═══════════════════════════════════════════
        document.querySelectorAll('.social-btn').forEach(btn => {
            btn.addEventListener('mousemove', (e) => {
                const rect = btn.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                btn.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px) scale(1.05)`;
            });

            btn.addEventListener('mouseleave', () => {
                btn.style.transform = 'translate(0, 0) scale(1)';
            });
        });

        // ═══════════════════════════════════════════
        // TYPEWRITER EFFECT
        // ═══════════════════════════════════════════
        const titleEl = document.getElementById('title');
        const titleText = 'zyntherax';
        let tCharIndex = 0;
        let tIsDeleting = false;

        function typeTitle() {
            const current = titleText.substring(0, tCharIndex);
            titleEl.textContent = current;

            let speed;

            if (!tIsDeleting) {
                tCharIndex++;
                speed = 120 + Math.random() * 80;
                if (tCharIndex > titleText.length) {
                    tIsDeleting = true;
                    speed = 2500;
                }
            } else {
                tCharIndex--;
                speed = 60 + Math.random() * 40;
                if (tCharIndex < 0) {
                    tIsDeleting = false;
                    tCharIndex = 0;
                    speed = 800;
                }
            }

            setTimeout(typeTitle, speed);
        }

        setTimeout(typeTitle, 1800);

        // ═══════════════════════════════════════════
        // CONNECTION LINES CANVAS
        // ═══════════════════════════════════════════
        const canvas = document.getElementById('connectionCanvas');
        const ctx = canvas.getContext('2d');
        canvas.style.position = 'fixed';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.pointerEvents = 'none';
        canvas.style.zIndex = '1';
        canvas.style.opacity = '0.3';

        let dots = [];
        const DOT_COUNT = 40;
        const CONNECTION_DIST = 150;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function initDots() {
            dots = [];
            for (let i = 0; i < DOT_COUNT; i++) {
                dots.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    size: Math.random() * 2 + 0.5
                });
            }
        }
        initDots();

        function drawConnections() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            dots.forEach(dot => {
                dot.x += dot.vx;
                dot.y += dot.vy;

                if (dot.x < 0 || dot.x > canvas.width) dot.vx *= -1;
                if (dot.y < 0 || dot.y > canvas.height) dot.vy *= -1;

                // Draw dot
                ctx.beginPath();
                ctx.arc(dot.x, dot.y, dot.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(120, 50, 255, 0.5)';
                ctx.fill();
            });

            // Draw connections
            for (let i = 0; i < dots.length; i++) {
                for (let j = i + 1; j < dots.length; j++) {
                    const dx = dots[i].x - dots[j].x;
                    const dy = dots[i].y - dots[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < CONNECTION_DIST) {
                        const alpha = (1 - dist / CONNECTION_DIST) * 0.4;
                        ctx.beginPath();
                        ctx.moveTo(dots[i].x, dots[i].y);
                        ctx.lineTo(dots[j].x, dots[j].y);
                        ctx.strokeStyle = `rgba(120, 50, 255, ${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }

                // Connect to mouse
                const mdx = dots[i].x - mouseX;
                const mdy = dots[i].y - mouseY;
                const mDist = Math.sqrt(mdx * mdx + mdy * mdy);
                if (mDist < 200) {
                    const alpha = (1 - mDist / 200) * 0.5;
                    ctx.beginPath();
                    ctx.moveTo(dots[i].x, dots[i].y);
                    ctx.lineTo(mouseX, mouseY);
                    ctx.strokeStyle = `rgba(255, 0, 110, ${alpha})`;
                    ctx.lineWidth = 0.8;
                    ctx.stroke();
                }
            }

            requestAnimationFrame(drawConnections);
        }
        drawConnections();

        // ═══════════════════════════════════════════
        // CLICK RIPPLE EFFECT
        // ═══════════════════════════════════════════
        document.addEventListener('click', (e) => {
            const ripple = document.createElement('div');
            ripple.style.cssText = `
                position: fixed;
                left: ${e.clientX}px;
                top: ${e.clientY}px;
                width: 0; height: 0;
                border: 2px solid rgba(120, 50, 255, 0.6);
                border-radius: 50%;
                pointer-events: none;
                z-index: 9997;
                transform: translate(-50%, -50%);
                animation: clickRipple 0.8s ease-out forwards;
            `;
            document.body.appendChild(ripple);

            // Spawn small particles on click
            for (let i = 0; i < 8; i++) {
                const sparkle = document.createElement('div');
                const angle = (Math.PI * 2 / 8) * i;
                const distance = 30 + Math.random() * 30;
                sparkle.style.cssText = `
                    position: fixed;
                    left: ${e.clientX}px;
                    top: ${e.clientY}px;
                    width: 3px; height: 3px;
                    background: ${trailColors[Math.floor(Math.random() * trailColors.length)]};
                    border-radius: 50%;
                    pointer-events: none;
                    z-index: 9997;
                    transform: translate(-50%, -50%);
                    transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
                    opacity: 1;
                `;
                document.body.appendChild(sparkle);

                requestAnimationFrame(() => {
                    sparkle.style.left = `${e.clientX + Math.cos(angle) * distance}px`;
                    sparkle.style.top = `${e.clientY + Math.sin(angle) * distance}px`;
                    sparkle.style.opacity = '0';
                    sparkle.style.transform = 'translate(-50%, -50%) scale(0)';
                });

                setTimeout(() => sparkle.remove(), 600);
            }

            setTimeout(() => ripple.remove(), 800);
        });

        // Add click ripple animation
        const rippleStyle = document.createElement('style');
        rippleStyle.textContent = `
            @keyframes clickRipple {
                0% { width: 0; height: 0; opacity: 1; }
                100% { width: 100px; height: 100px; opacity: 0; }
            }
        `;
        document.head.appendChild(rippleStyle);
    </script>
</body>
</html>
